name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build compiler and compile examples
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install assemblers
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils-riscv64-linux-gnu \
            binutils-mips-linux-gnu binutils-mips64-linux-gnuabi64 \
            binutils-powerpc-linux-gnu binutils-powerpc64-linux-gnu \
            binutils-sparc64-linux-gnu binutils-m68k-linux-gnu \
            binutils-s390x-linux-gnu binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi wabt qemu-user-static gcc-multilib

      - name: Install the Alpha and PA-RISC assemblers
        run: sudo apt-get install -y binutils-alpha-linux-gnu binutils-hppa-linux-gnu

      - name: Report which other machines this image could check
        run: |
          echo "cross assemblers available:"
          for arch in alpha arc hppa ia64 sh4 xtensa microblaze nios2 or1k m68k; do
            apt-cache show "binutils-$arch-linux-gnu" > /dev/null 2>&1 \
              && echo "  binutils-$arch-linux-gnu"
          done
          for pkg in binutils-avr binutils-msp430 binutils-bpf; do
            apt-cache show "$pkg" > /dev/null 2>&1 && echo "  $pkg"
          done
          echo "emulators available:"
          ls /usr/bin/qemu-*-static 2>/dev/null | sed 's|/usr/bin/qemu-|  |;s|-static||'

      - name: Install the LoongArch assembler, if this image has one
        run: |
          sudo apt-get install -y binutils-loongarch64-linux-gnu             || echo "no LoongArch assembler in this image; that step will skip"

      - name: Run POSIX smoke tests
        run: make smoke

      - name: Run PowerShell smoke tests
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -BuildDir build-pwsh
