name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build compiler and compile examples
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install assemblers
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils-riscv64-linux-gnu \
            binutils-mips-linux-gnu binutils-mips64-linux-gnuabi64 \
            binutils-powerpc-linux-gnu binutils-powerpc64-linux-gnu \
            binutils-sparc64-linux-gnu binutils-m68k-linux-gnu \
            binutils-s390x-linux-gnu binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi wabt qemu-user-static gcc-multilib

      - name: Install the Nios II assembler, if this image has one
        run: |
          sudo apt-get install -y binutils-nios2-linux-gnu \
            || echo "no Nios II assembler in this image; that step will skip"

      - name: Install the LoongArch assembler, if this image has one
        run: |
          sudo apt-get install -y binutils-loongarch64-linux-gnu             || echo "no LoongArch assembler in this image; that step will skip"

      - name: Run POSIX smoke tests
        run: make smoke

      - name: Run PowerShell smoke tests
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -BuildDir build-pwsh
